site_name: Skupper Documentation
site_url: https://skupper.io/docs/
docs_dir: doc-input
site_dir: output/docs

extra:
  # Static values for MVP - will be dynamic with macros plugin
  skupper_version: "2.2.3"
  skupper_cli_version: "2.2.3"
  skupper_version_v1: "1.9.6"
  # site_prefix controls navigation links in header/footer
  # For production (skupper.io): use empty string (relative paths)
  # For staging/preview: use full URL without trailing slash
  # For local dev: use http://localhost:8000 or your local server
  site_prefix: ""
  skupper_name: "Skupper"
# Support .html links in markdown (Transom compatibility)
use_directory_urls: false

theme:
  name: material
  custom_dir: config/mkdocs-overrides
  palette:
    primary: blue
    accent: green
  features:
    # - navigation.tabs  # REMOVED: This puts nav in horizontal tabs at top
    - navigation.sections  # Show sections in sidebar
    #- navigation.expand    # Auto-expand sections in sidebar
    - navigation.top       # Back to top button
    # navigation.indexes disabled — merges index.md into section headers,
    # which collapses single-page JTBD categories into direct links
    - search.suggest       # Search suggestions
    - search.highlight     # Highlight search terms
    - content.code.copy    # Copy button for code blocks
    - content.code.annotate # Code annotations
    - toc.integrate        # Integrate table of contents into sidebar

extra_css:
  - stylesheets/skupper-overrides.css

nav:
  - Home: index.md
  - Discover:
    - What is Skupper?: overview/index.md
    - Connectivity: overview/connectivity.md
    - Security: overview/security.md
    - Routing: overview/routing.md
    - Load balancing and failover: overview/load-balancing.md
  - Install:
    - Install and upgrade the Skupper controller: install/index.md
  - Deploy:
    - Skupper CLI on Kubernetes: kube-cli/index.md
    - Create a site on Kubernetes using the CLI: kube-cli/site-configuration.md
    - YAML on Kubernetes: kube-yaml/index.md
    - Create a site on Kubernetes using YAML: kube-yaml/site-configuration.md
    - Skupper CLI on local systems: system-cli/index.md
    - Create a site on a local system using the CLI: system-cli/site-configuration.md
    - YAML on local systems: system-yaml/index.md
    - Create a site on local systems using YAML: system-yaml/site-configuration.md
  - Configure:
    - Link sites on Kubernetes using the CLI: kube-cli/site-linking.md
    - Expose services on the application network using the CLI on Kubernetes: kube-cli/service-exposure.md
    - Link sites on Kubernetes using YAML: kube-yaml/site-linking.md
    - Expose services on the application network using YAML on Kubernetes: kube-yaml/service-exposure.md
    - Link sites on local systems using the CLI: system-cli/site-linking.md
    - Expose services on the application network using the CLI on local systems: system-cli/service-exposure.md
    - Link sites on local systems using YAML: system-yaml/site-linking.md
    - Expose services on the application network using YAML on local systems: system-yaml/service-exposure.md
  - Secure:
    - Secure inter-site communication with custom certificates: kube-yaml/custom-certs.md
  - Observe:
    - Maintain network health and service reachability: console/index.md
    - Network Observer Configuration Reference: console/configuration.md
  - Troubleshoot:
    - Troubleshoot link failures and resolve routing issues: troubleshooting/index.md
  - Upgrade:
    - Migrate from Skupper v1: overview/migrating.md
  - Reference:
    - Skupper resources on Kubernetes: overview/resources.md
  - ...

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Validation settings
validation:
  links:
    not_found: warn  # Warn but don't fail on missing links
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  - awesome-pages
  - macros:
      module_name: config/mkdocs_macros
